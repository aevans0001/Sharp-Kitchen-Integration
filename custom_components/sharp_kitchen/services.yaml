start_cook:
  name: Start Cook
  description: >-
    Start a manual cook on a Sharp Kitchen device. Only mode "microwave"
    with a power level has been tested; other modes/temperature are
    supported by the underlying API call but unverified.
  fields:
    device_id:
      name: Device ID
      description: >-
        The numeric device ID from Sharp's backend. This is the number in
        each device's Home Assistant entity unique IDs (e.g. the "13255" in
        "sharp_kitchen_13255_cook"), not anything printed on the appliance.
      required: true
      example: 13255
      selector:
        number:
          min: 1
          mode: box
    mode:
      name: Mode
      description: >-
        Cook mode name. "microwave" is confirmed working. Other values
        (e.g. convection/grill modes on other Sharp appliances) are passed
        through as-is and unverified.
      required: false
      default: microwave
      selector:
        text:
    cook_time:
      name: Cook Time
      description: 'Cook duration as H:MM:SS, e.g. "0:01:30" for 90 seconds.'
      required: false
      default: "0:01:00"
      selector:
        text:
    power:
      name: Power Level
      description: >-
        Microwave power level, 1-100. The real app's own screen shows this
        as a 0%-100% slider, so this range matches that -- but the exact
        number sent over the wire when the app's slider is at, say, 100%
        hasn't been independently confirmed by a network capture yet.
      required: false
      selector:
        number:
          min: 1
          max: 100
          mode: box
    temperature:
      name: Temperature
      description: >-
        Target temperature for modes that use one (e.g. oven/convection).
        Wired through to the API but never exercised in testing.
      required: false
      selector:
        number:
          min: 100
          max: 500
          mode: box
    with_preheat:
      name: With Preheat
      description: Whether to preheat before cooking. Unverified.
      required: false
      default: false
      selector:
        boolean:

start_smart_cook:
  name: Start Smart Cook
  description: >-
    Low-level Smart Cook command. The normal device UI validates the official
    SMD2489ES preset catalog and should be preferred. This raw service remains
    for backward compatibility and accepts the exact app protocol fields.
  fields:
    device_id:
      name: Device ID
      description: The numeric device ID from Sharp's backend.
      required: true
      example: 13255
      selector:
        number:
          min: 1
          mode: box
    auto_number:
      name: Preset Code
      description: >-
        Raw Smart Cook menu ID from the official app catalog, for example
        D7001, M8007, P3001_1, R3006, or S3011. This raw service does not
        replace the catalog-validating device UI.
      required: true
      example: D7001
      selector:
        text:
    auto_weight:
      name: App Parameter Value
      description: >-
        Exact string value sent by the app for the selected preset. Numeric
        and option presets have catalog-defined values; sensor programs use 0.
      required: true
      example: "1.2"
      selector:
        text: